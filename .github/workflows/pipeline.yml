name: Ingest

# One slot, 17:17 UTC, used twice a week most of the month and every day
# during a season's first week. Each run resumes the previous run's frontier,
# so a series of runs behaves as one continuous crawl.
#
# A match is only collectable while it sits in some player's last ~25 battles,
# so a day not crawled at the start of a season is a day lost for good --
# season 53 holds 1,955 sets from its first fourteen days and 1.37M from the
# rest. Cron cannot say "Monday, Thursday, or the week after the third
# Thursday", so it fires daily and the `decide` job below answers that
# question in code.
#
# 17:17 rather than the old 06:00: scheduled runs on the hour landed four to
# five hours late, 06:00 being when everyone else's crons are queued too. The
# odd minute matters more than the hour. The hour is what keeps the chain in
# order -- this is the only time anything publishes, and it falls after the
# draft agent trains (05:17) and after Atlas deploys (13:17), so a crawl can
# never land between a model and the site built from it. Atlas refuses to
# deploy when the dataset has moved ahead of the model it is validating
# against, which is correct, and which a crawl in that gap would trigger
# every Monday and Thursday.
on:
  schedule:
    - cron: "17 17 * * *"
  workflow_dispatch:
    inputs:
      season:
        description: "Season label, e.g. season50"
        required: false
      max_requests:
        description: "API request ceiling for this run"
        required: false
        default: "280000"
      min_rows_per_1k:
        description: "Yield floor; blank lets the season's age set it"
        required: false
      publish:
        description: "Publish the dataset if the quality gate passes"
        type: boolean
        default: true

# One crawl at a time. Two concurrent runs would resume the same frontier and
# duplicate every request, and the key sweep assumes a single pipeline per
# name prefix — parallel runs would revoke each other's keys mid-crawl.
concurrency:
  group: bsetl-ingest
  cancel-in-progress: false

permissions:
  contents: write   # only for the keepalive commit at the end of the crawl job
  pages: write
  id-token: write

env:
  # Season is computed from the calendar, not configured. Set only to override.
  SEASON_OVERRIDE: ${{ inputs.season }}
  DATASET_REPO: ${{ vars.BSETL_DATASET_REPO }}
  DB_PATH: data/seasons/working.db
  MAX_REQUESTS: ${{ inputs.max_requests || '280000' }}
  # seeds/<season>.txt when committed; otherwise written from the previous
  # season at the start of a new one.
  SEED_FILE: seeds/auto.txt

jobs:
  # Cheap, so the expensive job never starts on a day it should not run. Only
  # the daily entry is conditional: Monday and Thursday are the regular
  # schedule, and a dispatch is somebody asking for it on purpose.
  decide:
    runs-on: ubuntu-latest
    outputs:
      crawl: ${{ steps.check.outputs.crawl }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync
      - id: check
        # Fail loudly rather than emitting nothing: an empty output reads as
        # "do not crawl", which is the safe answer but an invisible one.
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "Dispatched by hand; crawling."
            echo "crawl=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          day=$(date -u +%u)          # 1 = Monday, 4 = Thursday
          opening=$(uv run bsetl-season opening --format bool)
          if [ "$day" = "1" ] || [ "$day" = "4" ] || [ "$opening" = "true" ]; then
            echo "crawl=true" >> "$GITHUB_OUTPUT"
          else
            echo "crawl=false" >> "$GITHUB_OUTPUT"
          fi
          cat "$GITHUB_OUTPUT"

  crawl:
    needs: decide
    if: needs.decide.outputs.crawl == 'true'
    runs-on: ubuntu-latest
    # Generous relative to the crawl's own 4-hour budget: the budget should end
    # the run, not the runner. GitHub caps a job at 6 hours.
    timeout-minutes: 300

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install
        run: uv sync --extra hub

      - name: Check configuration
        run: |
          test -n "$DATASET_REPO" || { echo "::error::Set the BSETL_DATASET_REPO repository variable"; exit 1; }

      # Ranked resets on the third Thursday of each month at 09:00 UTC, so the
      # current season is arithmetic. Rollover is automatic and cannot be
      # forgotten. The hour matters: a run firing before 09:00 on reset day
      # belongs to the season that is ending, and must keep collecting it.
      # SEASON_START bounds ingestion: battle logs fetched just after a reset
      # still hold pre-reset matches, which belong to the previous season.
      - name: Resolve season
        run: |
          if [ -n "$SEASON_OVERRIDE" ]; then
            echo "SEASON=$SEASON_OVERRIDE" >> "$GITHUB_ENV"
            echo "SEASON_START=1970-01-01T00:00:00Z" >> "$GITHUB_ENV"
            echo "MIN_ROWS_PER_1K=50" >> "$GITHUB_ENV"
          else
            uv run bsetl-season current --format env >> "$GITHUB_ENV"
          fi
          uv run bsetl-season current
          # An explicit input wins over both.
          if [ -n "${{ inputs.min_rows_per_1k }}" ]; then
            echo "MIN_ROWS_PER_1K=${{ inputs.min_rows_per_1k }}" >> "$GITHUB_ENV"
          fi

      # The runner is ephemeral, but the crawl frontier and fetched-tag ledger
      # must persist. Missing state is normal on a season's first run.
      - name: Restore working database
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          uv run bsetl-state pull \
            --repo-id "$DATASET_REPO" --season "$SEASON" \
            --dest "$DB_PATH" --allow-missing

      # A reset leaves an empty database, and there is no endpoint that lists
      # players, so a new season cannot start without seed tags. Only runs when
      # the restore above found nothing, which is exactly the first run of a
      # season. A committed seeds/<season>.txt still wins if one exists.
      - name: Seed a new season
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          if [ -f "$DB_PATH" ]; then
            echo "Resuming $SEASON; no seeding needed."
            : > "$SEED_FILE"
          elif [ -f "seeds/${SEASON}.txt" ]; then
            echo "Using committed seeds/${SEASON}.txt"
            cp "seeds/${SEASON}.txt" "$SEED_FILE"
          else
            uv run bsetl-state seeds \
              --repo-id "$DATASET_REPO" --season "$SEASON" \
              --out "$SEED_FILE" --min-elo 18 --limit 5000
          fi

      # --min-rows-per-1k-requests comes from the season's age rather than being
      # a constant. The floor exists to stop a saturated crawl re-draining
      # players it has already read; in a season's opening days it instead
      # measures how little of the season has been played. Season 54's first
      # run stopped after 25 minutes at 48.9 against a floor of 50, with 26,748
      # tags still on the frontier -- it was working, there was simply only 1.6
      # hours of ranked play in existence to find.
      # --provision-key signs in to the developer portal, mints a key scoped to
      # this runner's address, and revokes it when the run ends. No long-lived
      # key exists to leak.
      # --max-database-rows is a backstop, and the number comes from the runner
      # rather than from the data: at ~360 bytes a set, 12M sets is a 4.3 GB
      # working database, which doubles transiently while it is vacuumed before
      # upload. That peak plus the Parquet export fits a 14 GB runner with room
      # to spare; 15M would not. A season is projected to reach roughly 4M.
      - name: Crawl
        id: crawl
        env:
          BS_DEV_EMAIL: ${{ secrets.BS_DEV_EMAIL }}
          BS_DEV_PASSWORD: ${{ secrets.BS_DEV_PASSWORD }}
        run: |
          uv run bsetl-ingest \
            --provision-key \
            --clean-db-path "$DB_PATH" \
            --tags-file "$SEED_FILE" \
            --latest-runtime "$SEASON_START" \
            --max-depth 3 \
            --elo-queue-min 13 --elo-queue-max 23 \
            --high-elo-floor 18 \
            --elo-game-min 12 --elo-game-max 23 \
            --fetched-tags-ttl-hours 24 \
            --flush-every-n-batches 1 \
            --requests-per-second 20 \
            --max-requests "$MAX_REQUESTS" \
            --max-seconds 14400 \
            --min-rows-per-1k-requests "$MIN_ROWS_PER_1K" \
            --yield-grace-requests 8000 \
            --yield-window-requests 4000 \
            --max-database-rows 12000000 \
            > run-summary.json
          cat run-summary.json

      # Recomputed over the whole season each run: the ECDF for a time bin
      # changes as that bin fills, so bins near the end of the last run were
      # computed on partial data.
      - name: Compute skill feature
        run: |
          uv run bsetl-skill-features \
            --clean-db-path "$DB_PATH" \
            --season "$SEASON" \
            --bin-width-days 3 \
            --min-bin-count 5000 \
            --mapping normal

      - name: Quality gate
        id: gate
        run: uv run bsetl-check --clean-db-path "$DB_PATH" --season "$SEASON"

      - name: Export
        if: success()
        run: |
          uv run bsetl-export \
            --clean-db-path "$DB_PATH" \
            --out-dir "exports/$SEASON" \
            --season "$SEASON" \
            --repo-id "$DATASET_REPO"

      - name: Publish
        if: success() && (github.event_name == 'schedule' || inputs.publish)
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          uv run bsetl-publish \
            --local-dir "exports/$SEASON" \
            --repo-id "$DATASET_REPO" \
            --season "$SEASON" \
            --message "Scheduled update $(date -u +%Y-%m-%dT%H:%MZ)" \
            --yes

      # Always: a run that failed the gate, or crashed, still advanced the
      # frontier and the fetched-tag ledger. Discarding that would make the
      # next run repeat work this one already paid for.
      - name: Store working database
        if: always() && hashFiles('data/seasons/working.db') != ''
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          uv run bsetl-state push \
            --repo-id "$DATASET_REPO" --season "$SEASON" --db-path "$DB_PATH"

      # A published season is never crawled again, so its working database is
      # dead weight — and squashing cannot reclaim it, because it is a current
      # file rather than an old version. The season before this one is kept:
      # it is what the next season gets seeded from.
      - name: Prune retired season state
        if: always() && github.event_name == 'schedule'
        continue-on-error: true
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          uv run bsetl-state prune \
            --repo-id "$DATASET_REPO" --season "$SEASON" --keep-previous 1

      # Rendered from the database itself, so the page cannot claim anything
      # the data does not support.
      - name: Render status page
        if: always() && hashFiles('data/seasons/working.db') != ''
        run: uv run bsetl-report --clean-db-path "$DB_PATH" --out-dir site

      - name: Package status page
        if: always() && hashFiles('site/index.html') != ''
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      # GitHub switches off scheduled workflows in a public repository after 60
      # days with no repository activity. A workflow *run* is not activity --
      # only a commit is -- so a pipeline that is working perfectly turns itself
      # off two months after the last push. This leaves an empty marker commit
      # once the repository has been quiet long enough to be at risk, well
      # inside the 60 days, and does nothing at all while anyone is working on
      # it. Pushes made with GITHUB_TOKEN do not start further workflow runs,
      # so this cannot loop.
      # Never fail the run over this: the crawl is the job, and the next
      # scheduled run is another attempt. Firing at 45 days leaves about four
      # more tries before the 60-day limit, so one miss costs nothing.
      - name: Keep the schedule alive
        if: always() && github.event_name == 'schedule'
        continue-on-error: true
        run: |
          quiet_days=$(( ( $(date +%s) - $(git log -1 --format=%ct) ) / 86400 ))
          echo "Last commit was ${quiet_days} day(s) ago."
          if [ "$quiet_days" -lt 45 ]; then
            echo "Still well inside the window; nothing to do."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --allow-empty \
            -m "Keep scheduled workflows enabled (quiet for ${quiet_days} days)"
          git push

      - name: Upload run summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: run-summary-${{ github.run_id }}
          path: run-summary.json
          if-no-files-found: ignore
          retention-days: 30

  # Separate job because deployment needs the Pages environment. Requires Pages
  # to be enabled (Settings -> Pages -> Source: GitHub Actions). On a private
  # repository that needs a paid plan; the job is skipped harmlessly otherwise.
  publish-status-page:
    needs: crawl
    if: >-
      ${{ always() && contains(fromJSON('["success","failure"]'), needs.crawl.result) }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
        continue-on-error: true
