name: Maintenance

# The working database is pushed every run and grows all season, and the Hub
# keeps every version — so old revisions of state/ come to outweigh the dataset.
# Squashing discards those versions. It does not touch any current file: each
# season lives at its own path and stays exactly as it is.
# Weekly, on Saturday. Monthly was enough when the working database was pushed
# twice a week at half this size; it is not now. Between squashes the Hub holds
# every version pushed since the last one, so the interval sets how much dead
# weight accumulates.
#
# Saturday is deliberate: ingest runs Monday and Thursday, so this lands in the
# gap between them.
on:
  schedule:
    - cron: "0 5 * * 6"
  workflow_dispatch:

# Squashing rewrites the dataset repo's history. A crawl finishing its state
# push into a repo whose history moved underneath it is a bad way to find that
# out, so this shares the ingest lock and waits its turn.
concurrency:
  group: bsetl-ingest
  cancel-in-progress: false

jobs:
  squash-hub-history:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --extra hub
      - env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          test -n "${{ vars.BSETL_DATASET_REPO }}" || { echo "::error::Set BSETL_DATASET_REPO"; exit 1; }
          uv run bsetl-state squash --repo-id "${{ vars.BSETL_DATASET_REPO }}" --yes
